name: CastorPay CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-lint-typecheck:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Ruff Lint Check
        working-directory: ./backend
        run: ruff check app tests

      - name: Run Type Checking with MyPy
        working-directory: ./backend
        run: mypy app

  backend-tests:
    name: Backend Test Suite (Ledger, Idempotency & Chaos)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: castor_user
          POSTGRES_PASSWORD: castor_password
          POSTGRES_DB: castor_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run Unit, Integration & Chaos Tests
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql+asyncpg://castor_user:castor_password@localhost:5432/castor_test_db"
          SYNC_DATABASE_URL: "postgresql://castor_user:castor_password@localhost:5432/castor_test_db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key-for-test-environments-32chars"
          ENVIRONMENT: "testing"
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type Check & Production Build
        working-directory: ./frontend
        run: npm run build

  docker-build-verification:
    name: Docker Multi-Stage Build Check
    runs-on: ubuntu-latest
    needs: [backend-lint-typecheck, backend-tests, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: castor-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: castor-frontend:ci-check
